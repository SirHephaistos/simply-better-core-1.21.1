# Tag-triggered release.
#
# Simply Better Core ships a single jar for both sides. It is still named and checksummed explicitly, so a
# download can be verified and a release never ships an unlabelled artifact.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (without the leading v)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - run: chmod +x ./gradlew

      - name: build
        run: ./gradlew build --no-daemon
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: collect artifacts
        id: collect
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          VERSION="${VERSION%%-*}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          mkdir -p release
          for jar in build/libs/*.jar; do
            case "$jar" in *-sources.jar|*-dev.jar) continue ;; esac
            cp "$jar" release/
          done

          cd release
          sha256sum *.jar > SHA256SUMS
          {
            echo "| File | Install on | Size | SHA-256 |"
            echo "|---|---|---|---|"
            for f in *.jar; do
              printf '| `%s` | server and client | %s | `%s` |\n' \
                "$f" "$(du -h "$f" | cut -f1)" "$(sha256sum "$f" | cut -d' ' -f1)"
            done
          } > ../RELEASE_BODY.md

      - uses: softprops/action-gh-release@v2
        with:
          name: Simply Better Core ${{ steps.collect.outputs.version }}
          body_path: RELEASE_BODY.md
          files: |
            release/*.jar
            release/SHA256SUMS
          fail_on_unmatched_files: true
